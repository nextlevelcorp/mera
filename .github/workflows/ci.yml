name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  INSTALL_DIR: ${{ github.workspace }}/.godot-bin

jobs:
  build:
    name: Test and export web build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Godot version
        run: echo "GODOT_VERSION=$(tr -d '[:space:]' < .godot-version)" >> "$GITHUB_ENV"

      - name: Cache Godot binary and web templates
        uses: actions/cache@v4
        with:
          path: |
            .godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot (no-op when cached)
        run: bash scripts/install_godot.sh

      - name: Import project
        run: '"$GODOT" --headless --path game --import'

      - name: Unit tests
        run: '"$GODOT" --headless --path game --script res://tests/run_tests.gd'

      - name: Export web build
        run: |
          mkdir -p build/web
          "$GODOT" --headless --path game --export-release Web
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
