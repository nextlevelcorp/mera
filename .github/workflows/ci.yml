name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  INSTALL_DIR: ${{ github.workspace }}/.godot-bin

jobs:
  changelog:
    name: Changelog updated
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require docs/changelog.md when code changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          echo "$changed"
          if echo "$changed" | grep -qE '^(game/|scripts/|\.github/)' && ! echo "$changed" | grep -qx 'docs/changelog.md'; then
            echo "::error::Code or CI changed but docs/changelog.md did not."
            exit 1
          fi

  build:
    name: Test and export web build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Godot version
        run: echo "GODOT_VERSION=$(tr -d '[:space:]' < .godot-version)" >> "$GITHUB_ENV"

      - name: Cache Godot binary and web templates
        uses: actions/cache@v4
        with:
          path: |
            .godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot (no-op when cached)
        run: bash scripts/install_godot.sh

      - name: Import project
        run: '"$GODOT" --headless --path game --import'

      - name: Unit tests
        run: '"$GODOT" --headless --path game --script res://tests/run_tests.gd'

      - name: Export web build
        run: |
          mkdir -p build/web
          "$GODOT" --headless --path game --export-release Web
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: Export debug build to /debug/ (debug menu, mera_debug feature tag)
        run: |
          mkdir -p build/web/debug
          "$GODOT" --headless --path game --export-release "Web Debug"
          test -s build/web/debug/index.pck

      - name: Release build carries no debug menu (PRD F15)
        run: |
          # A file packed into the pck leaves a .remap entry; the release preset excludes debug/*.
          if grep -a -q "debug_menu.gd.remap" build/web/index.pck; then
            echo "::error::The release export contains the debug menu."
            exit 1
          fi
          grep -a -q "debug_menu.gd.remap" build/web/debug/index.pck

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
